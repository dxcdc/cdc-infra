version: "3.8"
services:
  ghost:
    image: gttransformadigital/ghost:1.0
    container_name: gttransformadigital-ghost
    restart: always
    networks:
      - gttransformadigital-net
    ports:
      - "2368:2368"
    environment:
      - url=http://localhost:2368
    volumes:
      - ghost_data:/var/lib/ghost/content
networks:
  gttransformadigital-net:
    driver: bridge
volumes:
  ghost_data:
