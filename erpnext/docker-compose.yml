version: "3"

services:
  backend:
    image: frappe/erpnext:v15.22.0
    restart: unless-stopped
    volumes:
      - erpnext-sites:/home/frappe/frappe-bench/sites
      - erpnext-logs:/home/frappe/frappe-bench/logs
    networks:
      - erpnext-network

  configurator:
    image: frappe/erpnext:v15.22.0
    restart: "no"
    entrypoint:
      - bash
      - -c
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_SOCKETIO";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      REDIS_SOCKETIO: redis-socketio:6379
      SOCKETIO_PORT: "9000"
    volumes:
      - erpnext-sites:/home/frappe/frappe-bench/sites
      - erpnext-logs:/home/frappe/frappe-bench/logs
    networks:
      - erpnext-network

  create-site:
    image: frappe/erpnext:v15.22.0
    restart: "no"
    volumes:
      - erpnext-sites:/home/frappe/frappe-bench/sites
      - erpnext-logs:/home/frappe/frappe-bench/logs
    entrypoint:
      - bash
      - -c
    command:
      - >
        wait-for-it -t 120 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        wait-for-it -t 120 redis-socketio:6379;
        export start=`date +%s`;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
          echo "Waiting for sites/common_site_config.json to be created by configurator...";
          sleep 5;
          if (( `date +%s`-start > 120 )); then
            echo "Error: common_site_config.json was not created.";
            exit 1
          fi
        done;
        echo "common_site_config.json found! Creating site...";
        bench new-site $$SITE_NAME --no-mariadb-socket --admin-password=$$ADMIN_PASSWORD --db-root-password=$$MYSQL_ROOT_PASSWORD --install-app erpnext --set-default;
    environment:
      SITE_NAME: ${FRAPPE_SITE_NAME:-erp.cdc.org.br}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-admin}
    networks:
      - erpnext-network

  db:
    image: mariadb:10.6
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed # Requisito do MariaDB 10.6 pro Frappe
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-admin}
    volumes:
      - erpnext-db-data:/var/lib/mysql
    networks:
      - erpnext-network

  frontend:
    image: frappe/erpnext:v15.22.0
    restart: unless-stopped
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: ${FRAPPE_SITE_NAME:-erp.cdc.org.br}
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - erpnext-sites:/home/frappe/frappe-bench/sites
      - erpnext-logs:/home/frappe/frappe-bench/logs
    ports:
      - "8080:8080"
    networks:
      - erpnext-network

  queue-default:
    image: frappe/erpnext:v15.22.0
    restart: unless-stopped
    command:
      - bench
      - worker
      - --queue
      - default,short
    volumes:
      - erpnext-sites:/home/frappe/frappe-bench/sites
      - erpnext-logs:/home/frappe/frappe-bench/logs
    networks:
      - erpnext-network

  queue-long:
    image: frappe/erpnext:v15.22.0
    restart: unless-stopped
    command:
      - bench
      - worker
      - --queue
      - long
    volumes:
      - erpnext-sites:/home/frappe/frappe-bench/sites
      - erpnext-logs:/home/frappe/frappe-bench/logs
    networks:
      - erpnext-network

  redis-cache:
    image: redis:6.2-alpine
    restart: unless-stopped
    volumes:
      - erpnext-redis-cache:/data
    networks:
      - erpnext-network

  redis-queue:
    image: redis:6.2-alpine
    restart: unless-stopped
    volumes:
      - erpnext-redis-queue:/data
    networks:
      - erpnext-network

  redis-socketio:
    image: redis:6.2-alpine
    restart: unless-stopped
    volumes:
      - erpnext-redis-socketio:/data
    networks:
      - erpnext-network

  scheduler:
    image: frappe/erpnext:v15.22.0
    restart: unless-stopped
    command:
      - bench
      - schedule
    volumes:
      - erpnext-sites:/home/frappe/frappe-bench/sites
      - erpnext-logs:/home/frappe/frappe-bench/logs
    networks:
      - erpnext-network

  websocket:
    image: frappe/erpnext:v15.22.0
    restart: unless-stopped
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    volumes:
      - erpnext-sites:/home/frappe/frappe-bench/sites
      - erpnext-logs:/home/frappe/frappe-bench/logs
    networks:
      - erpnext-network

volumes:
  erpnext-db-data:
  erpnext-redis-cache:
  erpnext-redis-queue:
  erpnext-redis-socketio:
  erpnext-sites:
  erpnext-logs:

networks:
  erpnext-network:
    driver: bridge
