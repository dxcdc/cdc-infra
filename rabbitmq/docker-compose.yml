version: "3.8"
services:
  rabbitmq:
    image: gttransformadigital/rabbitmq:1.0
    container_name: gttransformadigital-rabbitmq
    restart: always
    networks:
      - gttransformadigital-net
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=senha_segura
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
networks:
  gttransformadigital-net:
    driver: bridge
volumes:
  rabbitmq_data:
