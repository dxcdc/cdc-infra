version: "3.8"

services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:14
    container_name: wg-easy
    restart: unless-stopped
    environment:
      # O Idioma do painel Web
      - LANG=pt
      
      # [IMPORTANTE] Como o aplicativo celular acha seu servidor
      - WG_HOST=${WG_HOST}
      
      # Senha do painel web
      - PASSWORD=${WG_PASSWORD}
      
      # O DNS que os clientes vao usar quando conectados na VPN
      - WG_DEFAULT_DNS=1.1.1.1, 1.0.0.1
    volumes:
      - vpn-data:/etc/wireguard
    ports:
      # Porta do túnel UDP (Deve estar aberta no Firewall da VPS)
      - "51820:51820/udp"
      # Porta do Painel de Administração Web (TCP)
      - "51821:51821/tcp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1

volumes:
  vpn-data:
