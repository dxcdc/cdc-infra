version: "3.8"
services:
  n8n:
    image: gttransformadigital/n8n:1.0
    container_name: gttransformadigital-n8n
    restart: always
    networks:
      - gttransformadigital-net
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=senha_segura
    volumes:
      - n8n_data:/home/node/.n8n
networks:
  gttransformadigital-net:
    driver: bridge
volumes:
  n8n_data:
