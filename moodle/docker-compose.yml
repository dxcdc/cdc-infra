version: "3.8"
services:
  moodle:
    image: gttransformadigital/moodle:1.0
    container_name: gttransformadigital-moodle
    restart: always
    networks:
      - gttransformadigital-net
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      - MOODLE_DATABASE_HOST=mariadb
      - MOODLE_DATABASE_USER=bn_moodle
      - MOODLE_DATABASE_NAME=bitnami_moodle
      - MOODLE_DATABASE_PASSWORD=moodle_db_pass
    volumes:
      - moodle_data:/bitnami/moodle
      - moodle_moodledata:/bitnami/moodledata
    depends_on:
      - mariadb
  mariadb:
    image: gttransformadigital/mariadb:1.0
    container_name: gttransformadigital-moodle-mariadb
    restart: always
    networks:
      - gttransformadigital-net
    environment:
      - MARIADB_ROOT_PASSWORD=root_pass
      - MARIADB_USER=bn_moodle
      - MARIADB_PASSWORD=moodle_db_pass
      - MARIADB_DATABASE=bitnami_moodle
    volumes:
      - mariadb_data:/bitnami/mariadb
networks:
  gttransformadigital-net:
    driver: bridge
volumes:
  mariadb_data:
  moodle_data:
  moodle_moodledata:
